name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores LOCAIS (Supabase CLI). Nenhuma chave real é usada no CI.
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PDP_ROOT_DOMAIN: pontodopedido.localhost
  PDP_PATH_TENANTS: '1'
  PDP_APP_SUPABASE_URL: http://127.0.0.1:54321
  PDP_BILLING_SUPABASE_URL: http://127.0.0.1:55321

jobs:
  checks:
    name: Lint, tipos, unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção (next build)
        run: npm run build

  database-e2e:
    name: Banco (RLS, permissões, fluxos) e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase locais (pontodopedido + assinaturas)
        run: node scripts/local-supabase.mjs start
      - name: Configuração pública das instâncias locais
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          for (const [project, prefix] of [['app', 'APP'], ['billing', 'BILLING']]) {
            const status = JSON.parse(execFileSync('npx', ['supabase', 'status', '-o', 'json'], {
              cwd: `backend/${project}`, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'],
            }));
            const key = status.PUBLISHABLE_KEY ?? status.ANON_KEY;
            if (!key || /[\r\n]/.test(key)) throw new Error(`Chave pública local inválida: ${project}`);
            appendFileSync(process.env.GITHUB_ENV, `PDP_${prefix}_SUPABASE_PUBLISHABLE_KEY=${key}\n`);
          }
          JS
      - name: Testes de banco
        run: npm run test:db
      - name: Restaurante de demonstração
        run: node scripts/seed-local.mjs aurora --e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E de recuperação e confirmação dupla
        env:
          PDP_E2E_START: '1'
        run: npm run test:e2e -- tests/e2e/account-security.spec.ts
      - name: E2E
        env:
          PDP_E2E_START: '1'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: node scripts/local-supabase.mjs stop
