name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores LOCAIS (Supabase CLI). Nenhuma chave real é usada no CI.
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PDP_ROOT_DOMAIN: pontodopedido.localhost
  PDP_PATH_TENANTS: '1'
  PDP_APP_SUPABASE_URL: http://127.0.0.1:54321
  PDP_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  PDP_BILLING_SUPABASE_URL: http://127.0.0.1:55321
  PDP_BILLING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  checks:
    name: Lint, tipos, unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção (next build)
        run: npm run build

  database-e2e:
    name: Banco (RLS, permissões, fluxos) e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase locais (pontodopedido + assinaturas)
        run: node scripts/local-supabase.mjs start
      - name: Testes de banco
        run: npm run test:db
      - name: Restaurante de demonstração
        run: node scripts/seed-local.mjs aurora --e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E
        env:
          PDP_E2E_START: '1'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: node scripts/local-supabase.mjs stop
